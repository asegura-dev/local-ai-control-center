# Example LACC configuration.
#
# Copy this file, adjust it, and pass it to LACC. Every field below is optional
# except `workspace_root`; an absent field takes the default shown here.

# Base directory LACC treats as its working area. Required.
# Paths outside this directory are refused.
#
# Keep it OUTSIDE any git repository. Everything LACC reads, converts and records
# here is your own material, and inside a working tree it is one `git add -A` away
# from being published. LACC refuses a workspace inside a repository unless you
# acknowledge it below. Keeping it out of a synchronising folder (OneDrive, Dropbox)
# is the same argument: that folder copies its contents to another computer.
workspace_root: ~/lacc-workspace

# Acknowledge that the workspace sits inside a git working tree. False by default.
# LACC cannot tell whether git ignores that path - answering it means running git,
# which LACC does not do - so it refuses what it can see and leaves the judgement to
# you. Set this to true only after confirming the path is ignored.
workspace_in_repository: false

# The Ollama model a real provider uses (see installed models with `lacc profile`).
# Empty by default: naming a model is required to run against Ollama, so an empty
# value is a clear error rather than a guessed default.
model: qwen2.5:3b

# The language the model is asked to answer in. English by default: small local
# models follow instructions and write more reliably in it than in languages they
# saw less of during training. Set it to whatever the reader needs - the value is
# put into the prompt as written. It may not be empty: a blank language would mean
# letting the model choose, which is a guess, not a default.
output_language: English

# The context window to run the model with, in tokens. Unset by default.
# Unset is not unlimited: with no window named, the engine uses its own default -
# 4096 tokens on the version this was measured against, however much the model
# supports - and silently drops whatever does not fit, answering from the rest.
# When you set this, LACC asks the engine for exactly this window and refuses a
# prompt it estimates will not fit, rather than letting it be truncated.
# See `lacc profile` for what each installed model supports. A larger window costs
# memory: the same 3B model held 1990 MB at 2048 tokens and 2300 MB at 8192.
# context_tokens: 32768

# The largest file LACC will read or convert, in bytes. 32 MiB by default.
# A document is read into memory whole, so this is a ceiling about the machine, not
# about the model: whether the text then fits the model's context window is a
# different question with a different answer. Over the ceiling the run is refused,
# naming the file, its size and the limit.
max_input_bytes: 33554432

# Whether LACC may use the network. Off by default (local-first).
# Setting this to true does not grant network access to anything by itself: a
# skill must also request the `network` capability. Configuration is a ceiling,
# not a grant. It is also the ceiling over `engine_host` and `notifier` below:
# neither of them reaches anywhere while this is false.
network_access: false

# Where the Ollama engine runs. Empty by default, which means this machine.
# Local-first means not depending on someone else's computer, not staying on one
# machine: a desktop you own, on a network you control, is still local. Reaching it
# needs `network_access: true` AND this line - a host that is not written down here
# is never contacted, so no installer or environment variable can widen what LACC
# talks to. `OLLAMA_HOST` may only ever point at this machine, and this line wins
# over it, so an ambient variable cannot quietly send the work back to a smaller
# model. Documents go to whatever engine this names: name a machine you own.
# engine_host: http://desk:11434

# Where LACC says that a run finished. Off by default.
# For work that takes minutes on a bigger model and is waited on elsewhere. A
# notification says which skill ran, how it ended and how long it took - never a
# prompt, an answer, a path, or the text of anything read. Delivery is best effort:
# a notifier that cannot reach its server never fails a run that already worked.
# Check it with `lacc notify test` before relying on it.
#
# The server, topic and token are NOT written here: this names the environment
# variables they are read from, because a token in a configuration file is a token
# in a backup. There is no field that could hold the topic itself, and that is on
# purpose - on an ntfy server without authentication the topic IS the authentication,
# so anyone who has it can read your notifications and publish to them. Choose an
# unpredictable one (`lacc-tesis-7h3k9x`, not `lacc`).
#
# Only ntfy is supported, self-hosted, reached over your own private network.
# Third-party messaging services are not: a message telling one that you are working,
# on what and when, is information about your research whatever the body says.
notifier:
  ntfy:
    enabled: false
    server_url_env: NTFY_SERVER
    topic_env: NTFY_TOPIC
    token_env: NTFY_TOKEN
    priority: 3
    tags: []

# How much detail the audit trail records.
#   standard - metadata only: which capabilities were requested, whether they
#              were granted, which provider was called. Prompt and completion
#              text are NOT written to disk.
#   full     - the above plus prompt and completion content. Opt in deliberately:
#              prompts can contain whatever you were working on.
audit_level: standard

# What happens when an audit record cannot be written (full disk, permissions).
#   abort    - refuse to proceed. An execution that cannot be recorded does not
#              run. Safer for traceability, but LACC stops when logging breaks.
#   continue - proceed unrecorded. More robust, at the cost of a gap in the
#              audit trail exactly when something is going wrong.
audit_failure_policy: abort