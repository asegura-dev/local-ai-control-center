[project]
name = "local-ai-control-center"
version = "1.8.1"
description = "A local-first framework for private, reproducible, auditable AI-assisted workflows."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "psutil>=7.2.2",
    "pydantic>=2.13.4",
    "pypdf>=6.18.0",
    "python-docx>=1.2.0",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "typer>=0.27.0",
]

[project.optional-dependencies]
gui = ["customtkinter>=5.2.2"]

[project.scripts]
lacc = "local_ai_control_center.cli:main"

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.0",
    "types-pyyaml>=6.0.12.20260518",
    "types-psutil>=7.2.2.20260518",
]

[tool.uv]
link-mode = "copy"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

# CustomTkinter ships no type information. Narrow, named, and the rest of src stays strict
# (ADR-069).
[[tool.mypy.overrides]]
module = "customtkinter.*"
ignore_missing_imports = true

# The window subclasses a toolkit class that carries no annotations, so under `strict` it is
# a subclass of `Any`. Scoped to the one module that touches the toolkit; everything the
# window would otherwise decide lives in `features/review.py` and is checked normally
# (ADR-069).
[[tool.mypy.overrides]]
module = "local_ai_control_center.window"
disallow_subclassing_any = false

[tool.pytest.ini_options]
testpaths = ["tests"]
